<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اختبار إلكتروني</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        font-weight: 900;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      .hidden {
        display: none !important;
      }

      #login-container {
        max-width: 400px;
        margin: 100px auto;
        padding: 30px;
        background-color: #ffffff;
        border: 2px solid #007bff;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0, 123, 255, 0.2);
        text-align: center;
        transition: all 0.3s ease-in-out;
      }

      #login-container label {
        display: block;
        font-size: 18px;
        color: #333;
        margin-bottom: 8px;
        text-align: right;
      }

      #login-container input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }

      #login-container button {
        width: 100%;
        background-color: #007bff;
        color: white;
        padding: 12px 0;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      #login-container button:hover {
        background-color: #0056b3;
      }

      #result {
        margin-top: 20px;
        text-align: right;
      }

      #timer {
        font-size: 20px;
        color: red;
        font-weight: bold;
      }

      h2 {
        font-size: 22px;
        font-weight: 900;
        color: #000000;
      }

      label {
        font-size: 18px;
        font-weight: 900;
        color: #333333;
      }

      #next-button {
        position: fixed;
        bottom: 20px;
        left: 20px;
        padding: 12px 25px;
        font-weight: 900;
        z-index: 999;
      }
      #quizForm {
        padding-bottom: 100px;
      }
      .correct-answer {
        color: green;
        font-weight: 900;
      }

      .wrong-answer {
        color: red;
        font-weight: 900;
      }

      ul {
        list-style-type: none;
        padding: 0;
      }

      ul li {
        margin-bottom: 15px;
        background-color: #f0f4f8;
        padding: 10px;
        border-radius: 6px;
        font-weight: 900;
        color: #000;
        font-size: 18px;
      }

      #result h2,
      #result h3,
      #result p {
        font-weight: 900;
        color: #000;
        font-size: 18px;
        text-align: right;
      }

      #retry-button {
        padding: 10px 20px;
        font-weight: bold;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 20px;
      }

      label[lang="en"] {
        direction: ltr;
        text-align: left;
        display: block;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <h2>التدريب علي اختبارات الجهاز المركزى</h2>

    <div id="login-container">
      <label for="password">🔒 أدخل كلمة المرور:</label>
      <input id="password" type="password" placeholder="مثال: 12345678" />
      <label for="duration">⏳ حدد مدة الاختبار (بالدقائق):</label>
      <input id="duration" type="number" value="5" min="1" />
      <button onclick="checkPassword()">🚀 دخول</button>
    </div>

    <div class="hidden" id="quiz">
      <div id="timer">5:00</div>
      <div id="question-info">السؤال 1 من 20</div>
      <form id="quizForm">
        <div id="question-container"></div>
        <button id="next-button" onclick="nextQuestion(event)" type="button">
          التالي
        </button>
      </form>
    </div>

    <div class="hidden" id="result"></div>

    <script>
      const questions = [
        {
          question: "She ___ to the museum next month.",
          options: ["goes", "has gone", "is going", "had gone"],
          answer: "is going",
        },
        {
          question: "They ___ to the museum yesterday.",
          options: ["are going", "went", "go", "gone"],
          answer: "went",
        },
        {
          question:
            "After the earthquake, many personal items were scattered ______.",
          options: ["on the ground", "in the ground"],
          answer: "on the ground",
        },
        {
          question:
            "Due to the structural instability, the old farmhouse had finally collapsed and now lies ______.",
          options: ["on the ground", "in the ground"],
          answer: "on the ground",
        },
        {
          question:
            "The farmer planted the seeds ________ before the rainy season.",
          options: ["on the ground", "in the ground"],
          answer: "in the ground",
        },
        {
          question: "Choose the possessive pronoun. اختر ضمير الملكية",
          options: ["my", "myself", "mine", "me"],
          answer: "mine",
        },
        {
          question: "Choose the adverb. اختر الحال.",
          options: ["big", "excellent", "very", "beautiful"],
          answer: "very",
        },
        {
          question: "If she studied hard, she _____ pass the exam.",
          options: ["will", "would", "can", "is"],
          answer: "would",
        },
        {
          question:
            "If the manager ____ more time, he would listen to your suggestions.",
          options: ["has", "have", "had", "will have"],
          answer: "had",
        },
        {
          question: "His voice was _____ than his friends' voices.",
          options: ["loud", "louder", "loudest", "more loudly"],
          answer: "louder",
        },
        {
          question:
            "________ football ________ basketball is a good sport for me, I don’t like playing with a ball.",
          options: ["Either / or", "Neither / nor", "- / no"],
          answer: "Neither / nor",
        },
        {
          question:
            "Either the cafes in Riyadh or this coffee shop ________ good for studying.",
          options: ["are", "be", "is"],
          answer: "is",
        },
        {
          question: "Neither Ahmed nor his friends ___ present.",
          options: ["was", "is", "are", "has been"],
          answer: "are",
        },
        {
          question: "She …......... to the museum on Sunday.",
          options: [
            "suggested going",
            "suggested to going",
            "suggested that to go",
            "suggested for going",
          ],
          answer: "suggested going",
        },
        {
          question: "I suggested that he ________ to the doctor immediately.",
          options: ["gone", "went", "go", "should goes"],
          answer: "go",
        },
        {
          question: "Each .......... needs to submit the report before Friday.",
          options: ["manager", "managers", "of manager", "managing"],
          answer: "manager",
        },
        {
          question:
            "Each of the .......... has received a certificate of appreciation.",
          options: ["winner", "winners", "winning", "win"],
          answer: "winners",
        },
        {
          question:
            "By the time the police arrived, the thief .......... away.",
          options: [
            "escapes",
            "has escaped",
            "had escaped",
            "will have escaped",
          ],
          answer: "had escaped",
        },
        {
          question:
            "By the time you graduate next year, you .......... English for ten years.",
          options: [
            "will have studied",
            "studied",
            "have studied",
            "had studied",
          ],
          answer: "will have studied",
        },
        {
          question:
            "The committee ________ divided and there is bitterness among the members.",
          options: ["have not", "are", "is", "were"],
          answer: "were",
        },
        {
          question:
            "President Sisi is highly invested in the youth as the youth _______ the nation's future.",
          options: ["is", "are", "has"],
          answer: "are",
        },
        {
          question:
            "The number of applicants who have qualified for the final round of the teaching competition _______ officially announced by the committee this morning.",
          options: ["were", "was", "have been"],
          answer: "was",
        },
        {
          question:
            "A significant number of the training materials that were uploaded to the portal _______ currently being updated to ensure full compatibility with the new software version.",
          options: ["is", "are", "has been"],
          answer: "are",
        },
        {
          question:
            'Choose the correct English translation for the following sentence: "مصر هي أرض الحضارات والأديان."',
          options: [
            "Egypt are the land of civilizations and religions.",
            "Egypt is the land of civilizations and religions.",
            "Egypt was the land of civilizations and religions.",
            "Egypt have the land of civilizations and religions.",
          ],
          answer: "Egypt is the land of civilizations and religions.",
        },
        {
          question: "He is interested ____ art.",
          options: ["at", "on", "in"],
          answer: "in",
        },
        {
          question: "She is interested ____ drawing and painting.",
          options: ["of", "at", "in", "with", "on"],
          answer: "in",
        },
        {
          question:
            "We walked ______ the beach collecting small crabs in a bucket.",
          options: ["among", "besides", "along", "of"],
          answer: "along",
        },
        {
          question: "The bird flew ____ the river.",
          options: ["across", "through", "over", "above"],
          answer: "over",
        },
        {
          question: "The majority of the audience ____ applauding.",
          options: ["was", "were"],
          answer: "was",
        },
        {
          question: "Mathematics ___ my favourite subject.",
          options: ["are", "is", "be", "will be"],
          answer: "is",
        },
        {
          question: "Physics ___ one of my favorite subjects since childhood.",
          options: ["are", "have been", "is", "were"],
          answer: "is",
        },
        {
          question:
            "The flock of birds ___ towards the south when the storm hit.",
          options: ["was flying", "were flying", "flies", "have flown"],
          answer: "was flying",
        },
        {
          question:
            "By the time the show starts, we ___ waiting for over an hour.",
          options: ["will be", "will have been", "are", "have"],
          answer: "will have been",
        },
        {
          question: "Ten kilometers ___ too far to walk in this heat.",
          options: ["is", "are", "were", "be"],
          answer: "is",
        },
        {
          question:
            "A number of students ___ interested in joining the science club.",
          options: ["is", "are", "was", "has been"],
          answer: "are",
        },
        {
          question: "The committee ___ yet to make its final decision.",
          options: ["is", "are", "was", "has been"],
          answer: "is",
        },
        {
          question: "We always walk ____ the beach.",
          options: ["by", "at", "in"],
          answer: "by",
        },
      ];

      let currentQuestion = 0;
      let score = 0;
      let timer;
      let timeLeft;
      let userAnswers = [];

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function shuffleQuestions() {
        shuffle(questions);
        questions.forEach((q) => shuffle(q.options));
      }

      function checkPassword() {
        const passwordInput = document.getElementById("password").value;
        const durationInput =
          parseInt(document.getElementById("duration").value) || 10;
        timeLeft = durationInput * 60;

        if (passwordInput === "7") {
          shuffleQuestions();
          document.getElementById("login-container").classList.add("hidden");
          document.getElementById("quiz").classList.remove("hidden");
          document.getElementById("result").classList.add("hidden");
          currentQuestion = 0;
          score = 0;
          userAnswers = [];
          loadQuestion();
          startTimer();
        } else {
          alert("🚫 المحاولة غير صحيحة! تأكد من كتابة كلمة السر بشكل دقيق.");
        }
      }

      function loadQuestion() {
        const questionContainer = document.getElementById("question-container");
        questionContainer.innerHTML = `
    <h2 lang="en" dir="ltr">${questions[currentQuestion].question}</h2>
    ${questions[currentQuestion].options
      .map(
        (option) => `
      <label lang="en" dir="ltr">
        <input type="radio" name="option" value="${option}" />
        ${option}
      </label><br>
    `,
      )
      .join("")}
  `;
        document.getElementById("question-info").textContent = `السؤال ${
          currentQuestion + 1
        } من ${questions.length}`;
      }

      function nextQuestion(event) {
        event.preventDefault();
        const selected = document.querySelector('input[name="option"]:checked');
        if (!selected) return alert("اختر إجابة.");
        userAnswers[currentQuestion] = selected.value;
        if (selected.value === questions[currentQuestion].answer) score++;
        currentQuestion++;
        if (currentQuestion < questions.length) {
          loadQuestion();
        } else {
          clearInterval(timer);
          showResults();
        }
      }

      function showResults(timeUp = false) {
        document.getElementById("quiz").classList.add("hidden");
        const resultDiv = document.getElementById("result");
        resultDiv.classList.remove("hidden");

        const percent = ((score / questions.length) * 100).toFixed(1);

        let feedback = "";
        if (percent == 100) {
          feedback = "أنت بطل! برافو عليك 👏";
        } else if (percent >= 80) {
          feedback = "ممتاز! واضح إنك مذاكر كويس 💪";
        } else if (percent >= 60) {
          feedback = "كويس، بس محتاج تراجع شوية 🙂";
        } else if (percent >= 40) {
          feedback = "راجع الدروس تاني وحاول تركز أكتر 📚";
        } else {
          feedback = "ابدأ من الأول وراجع كويس، شد حيلك! 💡";
        }

        let warningMsg = "";
        if (timeUp && currentQuestion < questions.length) {
          warningMsg = `
        <p style="color: red;">⏰ انتهى الوقت قبل إكمال جميع الأسئلة.</p>
        <p>في المرة الجاية حاول تحل الأسئلة بشكل أسرع علشان تلحق تكمل 💡</p>
      `;
        }

        let review = "<h3>مراجعة الإجابات:</h3><ul>";
        questions.forEach((q, i) => {
          const ua = userAnswers[i] || "لم يُجب";
          const correct = q.answer;
          const isCorrect = ua === correct;
          review += `
        <li>
          <strong>السؤال ${i + 1}:</strong> ${q.question}<br>
          إجابتك: <span class="${
            isCorrect ? "correct-answer" : "wrong-answer"
          }">${ua}</span><br>
          الإجابة الصحيحة: <span class="correct-answer">${correct}</span><br>
          <strong>التفسير:</strong> ${q.explanation || "لا يوجد تفسير."}
        </li>
      `;
        });
        review += "</ul>";

        resultDiv.innerHTML = `
      ${warningMsg}
      <h2>نتيجة الاختبار</h2>
      <p>${score} من ${questions.length} | النسبة: ${percent}%</p>
      <p>${feedback}</p>
      ${review}
      <button id="retry-button" onclick="location.reload()">إعادة المحاولة</button>
    `;
      }

      function startTimer() {
        timer = setInterval(() => {
          timeLeft--;
          const minutes = Math.floor(timeLeft / 60);
          const seconds = timeLeft % 60;
          document.getElementById("timer").textContent = `${minutes}:${
            seconds < 10 ? "0" : ""
          }${seconds}`;
          if (timeLeft <= 0) {
            clearInterval(timer);
            alert("انتهى الوقت!");
            showResults(true);
          }
        }, 1000);
      }

      document
        .getElementById("quizForm")
        .addEventListener("keypress", function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            nextQuestion(event);
          }
        });
    </script>
  </body>
</html>
